name: verify
# Runs the judges' entry point on every push: clean checkout -> Docker -> `make run`.
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  make-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: make run
  unit-tests-python-versions:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install ./track_1b && cd track_1b && python -m unittest discover -s tests
