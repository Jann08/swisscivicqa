name: swisscivicqa
# llama.cpp CPU server images pinned by digest for reproducibility.
x-llama: &llama
  image: ghcr.io/ggml-org/llama.cpp@sha256:af8c29600d1de84945de13fa7f126d06fdae16c4b19dc7db1c69c74287eae257
  volumes: ["./models:/models:ro"]
  healthcheck:
    test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
    interval: 10s
    retries: 60
services:
  llm:
    <<: *llama
    command: ["-m", "/models/apertus-v1.5-8b-text-q8_0.gguf", "-c", "4096", "--jinja", "--host", "0.0.0.0", "--port", "8080"]
  judge:
    <<: *llama
    command: ["-m", "/models/gemma-3-12b-it-Q4_K_M.gguf", "-c", "4096", "--jinja", "--host", "0.0.0.0", "--port", "8080"]
